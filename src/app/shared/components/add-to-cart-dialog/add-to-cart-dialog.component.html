<h2 mat-dialog-title>Producto Añadido</h2>
<mat-dialog-content>
  <p>El producto se ha añadido a tu carrito. ¿Qué te gustaría hacer ahora?</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="'continue'">Seguir Comprando</button>
  <button mat-flat-button color="primary" [mat-dialog-close]="'view_cart'">Ver Carrito</button>
</mat-dialog-actions>

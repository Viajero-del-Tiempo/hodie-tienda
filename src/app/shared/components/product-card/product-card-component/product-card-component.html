<mat-card class="product-card card-outline-color" appearance="outlined">
  @if (image) { <img mat-card-image class="product-card-image" [src]="image" [alt]="product.name" /> }
  <mat-card-content>
    <h4>{{ product.name }}</h4>
    <span class="product-price">Desde {{ product.priceFrom | guarani }}</span>
    <div class="variant-samples">
      @for (variant of product.variants; track variant.id) {
        <span [class.sold-out]="variant.stock === 0" [title]="label(product,variant) + (variant.stock === 0 ? ' — Agotado' : '')">
          @if (variant.imageUrls[0]) { <img [src]="variant.imageUrls[0]" [alt]="label(product,variant)" /> }
          {{ label(product,variant) }}
        </span>
      }
    </div>
    @if (!available) { <p>Agotado</p> }
  </mat-card-content>
  <mat-card-actions><a matButton [routerLink]="['/store', product.slug]">Ver producto</a></mat-card-actions>
</mat-card>

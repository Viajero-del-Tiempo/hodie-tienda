<div class="quantity-input-container">
  <button type="button" matIconButton (click)="decrement()" [disabled]="quantity <= 1" aria-label="Reducir cantidad"><mat-icon>remove</mat-icon></button>
  <input matInput type="number" [value]="quantity" [disabled]="maxQuantity < 1" (change)="onQuantityInputChange($event)"
    min="1" step="1" [max]="maxQuantity" class="quantity-input" aria-label="Cantidad" />
  <button type="button" matIconButton (click)="increment()" [disabled]="quantity >= maxQuantity" aria-label="Aumentar cantidad"><mat-icon>add</mat-icon></button>
</div>
